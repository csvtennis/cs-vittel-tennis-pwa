<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#146c3a"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="CS Vittel Tennis"
  >

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./icons/apple-touch-icon.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icons/icon-192.png"
  >

  <title>
    CS Vittel Tennis
  </title>


  <style>

    body {
      margin: 0;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #f3f7f4;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }


    .card {
      width: calc(100% - 32px);

      max-width: 420px;

      padding: 30px 20px;

      background: white;

      border-radius: 20px;

      text-align: center;

      box-shadow:
        0 8px 30px
        rgba(0, 0, 0, 0.08);
    }


    .logo {
      width: 150px;

      height: auto;

      margin-bottom: 20px;
    }


    h1 {
      margin: 0 0 10px;

      color: #146c3a;

      font-size: 27px;
    }


    p {
      margin: 0;

      color: #64748b;

      line-height: 1.5;
    }

  </style>

</head>


<body>

  <div class="card">

    <img
      class="logo"
      src="./icons/icon-512.png"
      alt="CS Vittel Tennis"
    >

    <h1>
      CS Vittel Tennis
    </h1>

    <p>
      Application de gestion des séances et des présences
    </p>

  </div>


  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function() {

          navigator.serviceWorker
            .register(
              "./sw.js"
            )

            .then(
              function() {

                console.log(
                  "Service Worker enregistré."
                );

              }
            )

            .catch(
              function(error) {

                console.log(
                  "Erreur Service Worker :",
                  error
                );

              }
            );

        }
      );

    }

  </script>

</body>

</html>
