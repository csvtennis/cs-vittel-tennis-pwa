<script>

alert("DEBUT JAVASCRIPT OK");  
  window.onerror =
  function(
    message,
    source,
    line,
    column,
    error
  ) {

    alert(
      "ERREUR JAVASCRIPT\n\n" +
      "Message : " +
      message +
      "\n\nLigne : " +
      line +
      "\nColonne : " +
      column
    );

    console.error(
      "Erreur JavaScript :",
      error
    );

    return false;
  };

  /*
   * ======================================
   * CONFIGURATION
   * ======================================
   *
   * Remplace uniquement l'adresse
   * ci-dessous par ton URL Apps Script
   * se terminant par /exec.
   */

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxPFDtMO7OS8VYLMK53nvL4rvo6aJWF5otzx_wVE4KzGaO5M3V39eYJiNegUwloMZo5/exec";


  const TOKEN_KEY =
    "csvt_coach_token";

  let currentSession = null;

let currentPlayers = [];

let currentAttendance = {};

let coachAttendance = "";

  /*
   * Limite le nombre de tentatives
   * de lecture du résultat de connexion.
   */

  const MAX_LOGIN_ATTEMPTS =
    15;


  /*
   * ======================================
   * OUTILS
   * ======================================
   */

  function byId(id) {

    return document
      .getElementById(id);

  }


  function afficherStatut(
    message,
    type
  ) {

    const status =
      byId("status");


    status.textContent =
      message;


    status.classList.remove(
      "error",
      "loading"
    );


    if (
      type ===
      "error"
    ) {

      status.classList.add(
        "error"
      );

    }


    if (
      type ===
      "loading"
    ) {

      status.classList.add(
        "loading"
      );

    }

  }


  function afficherErreur(
    message
  ) {

    afficherStatut(
      message,
      "error"
    );

  }


  function supprimerScript(
    script
  ) {

    if (
      script &&
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }

  }


  /*
   * ======================================
   * RÉCEPTION DE LA LISTE ENTRAÎNEURS
   * ======================================
   *
   * Cette fonction est appelée
   * par la réponse JSONP Apps Script.
   */

  function recevoirEntraineurs(
    result
  ) {

    const select =
      byId("coachSelect");


    select.innerHTML =
      "";


    const firstOption =
      document.createElement(
        "option"
      );


    firstOption.value =
      "";


    firstOption.textContent =
      "Sélectionnez votre nom";


    select.appendChild(
      firstOption
    );


    if (
      !result ||
      !result.succes
    ) {

      afficherErreur(
        result &&
        result.message
          ? result.message
          : "Réponse invalide du serveur."
      );


      return;

    }


    if (
      !Array.isArray(
        result.coaches
      ) ||
      result.coaches.length ===
        0
    ) {

      afficherErreur(
        "Aucun entraîneur actif."
      );


      return;

    }


    result.coaches.forEach(
      function(coach) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          coach.id;


        option.textContent =
          coach.nom;


        select.appendChild(
          option
        );

      }
    );


    select.selectedIndex =
      0;


    afficherStatut(
      result.coaches.length +
      " entraîneur(s) chargé(s).",
      "success"
    );

  }


  /*
   * ======================================
   * CHARGEMENT DES ENTRAÎNEURS
   * ======================================
   */

  function chargerEntraineurs() {

    alert("chargerEntraineurs démarre");

    alert(
  "VERSION TEST PWA 20"
);

  const select =
    byId(
      "coachSelect"
    );


  afficherStatut(
    "Chargement depuis Apps Script...",
    "loading"
  );


  select.innerHTML =
    '<option value="">' +
    'Chargement des entraîneurs...' +
    '</option>';


  const callbackName =
    "recevoirCoaches_" +
    Date.now();


  const script =
    document.createElement(
      "script"
    );


  let termine =
    false;


  /*
   * Diagnostic après 8 secondes.
   */

  const timeout =
    setTimeout(
      function() {

        if (termine) {
          return;
        }


        termine =
          true;


        supprimerScript(
          script
        );


        afficherErreur(
          "Apps Script ne répond pas à getCoaches."
        );

      },
      8000
    );


  window[
    callbackName
  ] =
    function(result) {

      if (termine) {
        return;
      }


      termine =
        true;


      clearTimeout(
        timeout
      );


      delete window[
        callbackName
      ];


      supprimerScript(
        script
      );


      select.innerHTML =
        "";


      const first =
        document.createElement(
          "option"
        );


      first.value =
        "";


      first.textContent =
        "Sélectionnez votre nom";


      select.appendChild(
        first
      );


      if (
        !result ||
        !result.succes ||
        !Array.isArray(
          result.coaches
        )
      ) {

        afficherErreur(
          "Réponse Apps Script incorrecte."
        );


        return;

      }


      result.coaches.forEach(
        function(coach) {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            coach.id;


          option.textContent =
            coach.nom;


          select.appendChild(
            option
          );

        }
      );


      afficherStatut(
        result.coaches.length +
        " entraîneur(s) chargé(s).",
        "success"
      );

    };


  script.src =

    APPS_SCRIPT_URL +

    "?action=getCoaches" +

    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +

    "&t=" +
    Date.now();


  console.log(
    "URL getCoaches :",
    script.src
  );


  script.onerror =
    function() {

      if (termine) {
        return;
      }


      termine =
        true;


      clearTimeout(
        timeout
      );


      delete window[
        callbackName
      ];


      supprimerScript(
        script
      );


      afficherErreur(
        "Erreur de chargement de l'API Apps Script."
      );

    };


  document.body
    .appendChild(
      script
    );

}


  /*
   * ======================================
   * AFFICHAGE DU CODE PERSONNEL
   * ======================================
   */

  byId("coachSelect")
    .addEventListener(
      "change",
      function() {

        const coachId =
          this.value;


        byId("coachCode")
          .value =
          "";


        byId("connectedBox")
          .classList
          .add(
            "hidden"
          );


        if (!coachId) {

          byId("loginZone")
            .classList
            .add(
              "hidden"
            );


          afficherStatut(
            "Sélectionnez un entraîneur.",
            "loading"
          );


          return;

        }


        byId("loginZone")
          .classList
          .remove(
            "hidden"
          );


        afficherStatut(
          "Saisissez votre code personnel.",
          "loading"
        );


        setTimeout(
          function() {

            byId("coachCode")
              .focus();

          },
          100
        );

      }
    );


  /*
   * ======================================
   * BOUTON DE CONNEXION
   * ======================================
   */

  byId("loginButton")
    .addEventListener(
      "click",
      connecterEntraineur
    );


  byId("coachCode")
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Enter"
        ) {

          event.preventDefault();


          connecterEntraineur();

        }

      }
    );


  /*
   * ======================================
   * ENVOI DE LA CONNEXION
   * ======================================
   */

  function connecterEntraineur() {

    const coachId =
      byId("coachSelect")
        .value;


    const code =
      byId("coachCode")
        .value
        .trim();


    const button =
      byId("loginButton");


    if (!coachId) {

      afficherErreur(
        "Sélectionnez votre nom."
      );


      return;

    }


    if (!code) {

      afficherErreur(
        "Saisissez votre code personnel."
      );


      return;

    }


    let requestId;


    if (
      window.crypto &&
      typeof window.crypto.randomUUID ===
        "function"
    ) {

      requestId =
        window.crypto.randomUUID();

    }

    else {

      requestId =

        Date.now()
          .toString() +

        Math.random()
          .toString(36)
          .substring(2);

    }


    const payload = {

      action:
        "loginCoach",

      requestId:
        requestId,

      coachId:
        coachId,

      code:
        code

    };


    button.disabled =
      true;


    button.textContent =
      "Connexion...";


    afficherStatut(
      "Vérification du code personnel...",
      "loading"
    );


    fetch(
      APPS_SCRIPT_URL,
      {

        method:
          "POST",

        mode:
          "no-cors",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(
            payload
          )

      }
    )

      .then(
        function() {

          /*
           * Laisse Apps Script traiter
           * le POST avant de demander
           * le résultat.
           */

          setTimeout(
            function() {

              recupererConnexion(
                requestId,
                0
              );

            },
            900
          );

        }
      )

      .catch(
        function(error) {

          console.error(
            error
          );


          button.disabled =
            false;


          button.textContent =
            "Se connecter";


          afficherErreur(
            "Impossible de contacter Google Apps Script."
          );

        }
      );

  }


  /*
   * ======================================
   * RÉCUPÉRATION DU JETON
   * ======================================
   */

  function recupererConnexion(
    requestId,
    attempt
  ) {

    if (
      attempt >=
      MAX_LOGIN_ATTEMPTS
    ) {

      byId("loginButton")
        .disabled =
        false;


      byId("loginButton")
        .textContent =
        "Se connecter";


      afficherErreur(
        "La connexion a expiré. Réessayez."
      );


      return;

    }


    const callbackName =

      "loginCallback_" +

      requestId.replace(
        /-/g,
        ""
      ) +

      "_" +

      attempt;


    window[
      callbackName
    ] =
      function(result) {

        delete window[
          callbackName
        ];


        supprimerScript(
          script
        );


        if (
          result &&
          result.attente
        ) {

          setTimeout(
            function() {

              recupererConnexion(
                requestId,
                attempt + 1
              );

            },
            700
          );


          return;

        }


        byId("loginButton")
          .disabled =
          false;


        byId("loginButton")
          .textContent =
          "Se connecter";


        if (
          !result ||
          !result.succes
        ) {

          afficherErreur(
            result &&
            result.message
              ? result.message
              : "Connexion refusée."
          );


          return;

        }


        /*
         * Enregistrement local
         * du jeton de 12 heures.
         */

        localStorage
  .setItem(
    TOKEN_KEY,
    result.token
  );


        byId("coachCode")
          .value =
          "";


        byId("connectedName")
          .textContent =
          "Connexion réussie : " +
          result.entraineur.nom;


        byId("connectedBox")
          .classList
          .remove(
            "hidden"
          );

  function chargerMesSeances() {

  const token =

    );


  if (!token) {

    afficherErreur(
      "Session introuvable. Reconnectez-vous."
    );

    return;

  }


  const zone =
    byId(
      "sessionsZone"
    );

    byId(
      "sessionsList"
    );


  zone.classList.remove(
    "hidden"
  );


  list.innerHTML =
    "Chargement des séances...";


  const callbackName =

    "sessionsCallback_" +

    Date.now();


  window[
    callbackName
  ] =
    function(result) {

      delete window[
        callbackName
      ];


      if (
        !result ||
        !result.succes
      ) {

        list.innerHTML =
          "";


        afficherErreur(
          result &&
          result.message
            ? result.message
            : "Impossible de charger les séances."
        );


        return;

      }


      afficherMesSeances(
        result.sessions || []
      );

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =

    APPS_SCRIPT_URL +

    "?action=getSessions" +

    "&token=" +
    encodeURIComponent(
      token
    ) +

    "&callback=" +
    callbackName +

    "&t=" +
    Date.now();


  script.onerror =
    function() {

      afficherErreur(
        "Impossible de charger les séances."
      );

    };


  document.body
    .appendChild(
      script
    );

}

  function ouvrirPointage(session) {

  currentSession =
    session;

  currentPlayers =
    [];

  currentAttendance =
    {};

  coachAttendance =
    (
      session.coachAttendance ||
      ""
    ).toUpperCase();


  byId("attendanceZone")
    .classList
    .remove("hidden");


  byId("attendanceSessionInfo")
    .innerHTML =

    "<strong>" +
    session.date +
    "</strong><br>" +

    "🕐 " +
    session.start +
    " - " +
    session.end +
    "<br>" +

    "🎾 " +
    session.groupName;


  byId("coachPresent")
    .classList
    .toggle(
      "selected",
      coachAttendance ===
        "PRESENT"
    );


  byId("coachAbsent")
    .classList
    .toggle(
      "selected",
      coachAttendance ===
        "ABSENT"
    );


  byId("playersList")
    .innerHTML =
    "Chargement des joueurs...";


  const token =
    localStorage.getItem(
      TOKEN_KEY
    );


  const callbackName =
    "attendanceCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {

      delete window[
        callbackName
      ];


      if (
        !result ||
        !result.succes
      ) {

        afficherErreur(
          result &&
          result.message
            ? result.message
            : "Impossible de charger les joueurs."
        );

        return;

      }


      currentPlayers =
        result.players || [];


      currentAttendance =
        Object.assign(
          {},
          result.attendance || {}
        );


      afficherJoueurs();

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =

    APPS_SCRIPT_URL +

    "?action=getAttendance" +

    "&token=" +
    encodeURIComponent(token) +

    "&sessionId=" +
    encodeURIComponent(
      session.id
    ) +

    "&callback=" +
    callbackName +

    "&t=" +
    Date.now();


  script.onerror =
    function() {

      afficherErreur(
        "Impossible de récupérer la feuille de présence."
      );

    };


  document.body.appendChild(
    script
  );


  byId("attendanceZone")
    .scrollIntoView({
      behavior: "smooth"
    });

}

  }

        );

          ] =

          absent.classList.add(

          );

          );

      );

      );

      );

      );

      );

  function mettreAJourValidation() {

  const tousRenseignes =
    currentPlayers.length > 0 &&

    currentPlayers.every(
      function(player) {

        return (
          currentAttendance[
            player.id
          ] === "PRESENT" ||

          currentAttendance[
            player.id
          ] === "ABSENT"
        );

      }
    );


  const entraineurRenseigne =
    coachAttendance === "PRESENT" ||
    coachAttendance === "ABSENT";


  byId("saveAttendanceButton")
    .disabled =
    !tousRenseignes ||
    !entraineurRenseigne;

}

  byId("saveAttendanceButton")

  );


function enregistrerPointage() {

  if (!currentSession) {

    afficherErreur(
      "Aucune séance ouverte."
    );

    return;

  }


  const token =
    localStorage.getItem(
      TOKEN_KEY
    );


  if (!token) {

    afficherErreur(
      "Session expirée. Reconnectez-vous."
    );

    return;

  }


  const items =
    currentPlayers.map(
      function(player) {

        return {

          playerId:
            player.id,

          status:
            currentAttendance[
              player.id
            ]

        };

      }
    );


  const requestId =
    window.crypto &&
    typeof window.crypto.randomUUID ===
      "function"

      ? window.crypto.randomUUID()

      : Date.now().toString() +
        Math.random()
          .toString(36)
          .substring(2);


  const payload = {

    action:
      "saveAttendance",

    requestId:
      requestId,

    token:
      token,

    sessionId:
      currentSession.id,

    coachAttendance:
      coachAttendance,

    items:
      items

  };


  const button =
    byId(
      "saveAttendanceButton"
    );


  button.disabled =
    true;


  button.textContent =
    "Enregistrement...";


  fetch(
    APPS_SCRIPT_URL,
    {

      method:
        "POST",

      mode:
        "no-cors",

      headers: {

        "Content-Type":
          "text/plain;charset=utf-8"

      },

      body:
        JSON.stringify(
          payload
        )

    }
  )

    .then(
      function() {

        setTimeout(
          function() {

            recupererResultatPointage(
              requestId,
              0
            );

          },
          900
        );

      }
    )

    .catch(
      function() {

        button.disabled =
          false;


        button.textContent =
          "Valider la séance";


        afficherErreur(
          "Impossible d'enregistrer la séance."
        );

      }
    );

}

  function recupererResultatPointage(
  requestId,
  attempt
) {

  if (
    attempt >= 15
  ) {

    byId("saveAttendanceButton")
      .disabled =
      false;


    byId("saveAttendanceButton")
      .textContent =
      "Valider la séance";


    afficherErreur(
      "Délai dépassé pendant l'enregistrement."
    );


    return;

  }


  const callbackName =

    "saveCallback_" +

    requestId.replace(
      /-/g,
      ""
    ) +

    "_" +

    attempt;


  const script =
    document.createElement(
      "script"
    );


  window[callbackName] =
    function(result) {

      delete window[
        callbackName
      ];


      supprimerScript(
        script
      );


      if (
        result &&
        result.attente
      ) {

        setTimeout(
          function() {

            recupererResultatPointage(
              requestId,
              attempt + 1
            );

          },
          700
        );


        return;

      }


      byId("saveAttendanceButton")
        .textContent =
        "Valider la séance";


      if (
        !result ||
        !result.succes
      ) {

        mettreAJourValidation();


        afficherErreur(
          result &&
          result.message
            ? result.message
            : "Erreur d'enregistrement."
        );


        return;

      }


      afficherStatut(
        result.message ||
        "Séance enregistrée.",
        "success"
      );


      byId("attendanceZone")
        .classList
        .add(
          "hidden"
        );


      currentSession =
        null;


      /*
       * Recharge les séances :
       * PLANIFIEE devient EFFECTUEE
       * et le pointage reste corrigeable
       * pendant la fenêtre autorisée.
       */

      chargerMesSeances();

    };


  script.src =

    APPS_SCRIPT_URL +

    "?action=getSaveResult" +

    "&requestId=" +
    encodeURIComponent(
      requestId
    ) +

    "&callback=" +
    callbackName +

    "&t=" +
    Date.now();


  script.onerror =
    function() {

      delete window[
        callbackName
      ];


      supprimerScript(
        script
      );


      mettreAJourValidation();


      afficherErreur(
        "Impossible de vérifier l'enregistrement."
      );

    };


  document.body
    .appendChild(
      script
    );

}

function verifierSessionExistante() {

  const token =
    localStorage.getItem(
      TOKEN_KEY
    );


  /*
   * Pas de jeton :
   * charge immédiatement les entraîneurs.
   */

  if (!token) {

    afficherStatut(
      "Chargement des entraîneurs...",
      "loading"
    );

    chargerEntraineurs();

    return;

  }


  /*
   * Un jeton existe :
   * tentative de reconnexion.
   */

  afficherStatut(
    "Reconnexion en cours...",
    "loading"
  );


  const callbackName =
    "sessionCallback_" +
    Date.now();


  const script =
    document.createElement(
      "script"
    );


  let termine =
    false;


  /*
   * Sécurité :
   * si Apps Script ne répond pas sous
   * 5 secondes, retour à la connexion.
   */

  const timeout =
    setTimeout(
      function() {

        if (termine) {
          return;
        }


        termine =
          true;


        localStorage.removeItem(
          TOKEN_KEY
        );


        supprimerScript(
          script
        );


        afficherStatut(
          "Chargement des entraîneurs...",
          "loading"
        );


        chargerEntraineurs();

      },
      5000
    );


  window[callbackName] =
    function(result) {

      if (termine) {
        return;
      }


      termine =
        true;


      clearTimeout(
        timeout
      );


      delete window[
        callbackName
      ];


      supprimerScript(
        script
      );


      /*
       * Jeton refusé ou expiré.
       */

      if (
        !result ||
        !result.succes
      ) {

        localStorage.removeItem(
          TOKEN_KEY
        );


        afficherStatut(
          "Chargement des entraîneurs...",
          "loading"
        );


        chargerEntraineurs();

        return;

      }


      /*
       * Session valide.
       */

      byId("connectedName")
        .textContent =
        "Connexion réussie : " +
        result.entraineur.nom;


      byId("connectedBox")
        .classList
        .remove(
          "hidden"
        );


      byId("loginZone")
        .classList
        .add(
          "hidden"
        );


      byId("coachSelect")
        .disabled =
        true;


      afficherStatut(
        "Session restaurée : " +
        result.entraineur.nom,
        "success"
      );


      chargerMesSeances();

    };


  script.src =

    APPS_SCRIPT_URL +

    "?action=checkSession" +

    "&token=" +
    encodeURIComponent(
      token
    ) +

    "&callback=" +
    callbackName +

    "&t=" +
    Date.now();


  script.onerror =
    function() {

      if (termine) {
        return;
      }


      termine =
        true;


      clearTimeout(
        timeout
      );


      delete window[
        callbackName
      ];


      supprimerScript(
        script
      );


      localStorage.removeItem(
        TOKEN_KEY
      );


      afficherStatut(
        "Chargement des entraîneurs...",
        "loading"
      );


      chargerEntraineurs();

    };


  document.body.appendChild(
    script
  );

}

  function deconnecterEntraineur() {

  const token =

    );


  /*
   * Suppression locale immédiate.
   */

  localStorage.removeItem(
    TOKEN_KEY

    .add(

    );

    .value =

  byId("coachCode")

  byId("loginZone")

    .add(

    );


  afficherStatut(

  );


  /*
   * Suppression également
   * côté Apps Script.
   */

  if (token) {

    const callbackName =
      "logoutCallback_" +
      Date.now();


    const script =
      document.createElement(
        "script"
      );


    window[callbackName] =
      function() {

        delete window[
          callbackName
        ];


        supprimerScript(
          script
        );

      };


    script.src =

      APPS_SCRIPT_URL +

      "?action=logout" +

      "&token=" +
      encodeURIComponent(
        token
      ) +

      "&callback=" +
      callbackName +

      "&t=" +
      Date.now();


    script.onerror =
      function() {

        delete window[
          callbackName
        ];


        supprimerScript(
          script
        );

      };


    document.body
      .appendChild(
        script
      );

  }


  chargerEntraineurs();

}
